<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinelle</title>
<link rel="icon" type="image/png" href="/logo.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/logo.png?v=2">
<meta name="theme-color" content="#080C16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sentinelle">
<style>
  :root{
    --ink-0:#080C16; --ink-1:#0E1526; --ink-2:#161F36; --ink-3:#1E2A47;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.05);
    --text:#EAEEF7; --muted:#93A0BC; --faint:#66738f;
    --gold:#F5B84A; --gold-deep:#E0952A; --gold-soft:rgba(245,184,74,.13);
    --teal:#57D8C3;
    --in:#12384f; --out:#183a2f;
    --ff-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --ff-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ff-mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--ff-sans);background:var(--ink-0);color:var(--text);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--gold);color:#0a0a0a}
  .beam{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(50vw 34vw at 82% -8%,rgba(245,184,74,.12),transparent 60%),radial-gradient(44vw 34vw at 6% 4%,rgba(87,216,195,.05),transparent 55%)}
  input{font-family:inherit}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

  /* ————— Login ————— */
  #login{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  #login .logo{width:74px;height:74px;border-radius:20px;box-shadow:0 14px 40px -12px rgba(245,184,74,.5)}
  #login h1{font-family:var(--ff-display);font-size:2rem;font-weight:600;letter-spacing:.01em}
  #login .eyebrow{font-family:var(--ff-mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  #login p{color:var(--muted);max-width:340px;font-size:.95rem}
  #login input{background:var(--ink-2);border:1px solid var(--line);color:var(--text);padding:13px 16px;border-radius:12px;font-size:1rem;outline:none;width:290px;text-align:center}
  #login input:focus{border-color:var(--gold)}
  #login button{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#1a1204;border:0;padding:13px 26px;border-radius:100px;font-weight:600;font-size:1rem;box-shadow:0 10px 26px -8px rgba(245,184,74,.5)}
  #login .err{color:#ff8fa3;font-size:.85rem;min-height:1em}

  /* ————— App shell ————— */
  #app{display:none;grid-template-columns:352px 1fr;height:100vh;position:relative;z-index:1}
  #side{background:linear-gradient(180deg,var(--ink-1),var(--ink-0));border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .s-brand{display:flex;align-items:center;gap:11px;padding:18px 20px 14px}
  .s-brand img{width:30px;height:30px;border-radius:9px}
  .s-brand .nm{font-family:var(--ff-display);font-size:1.18rem}
  .s-brand .live{margin-left:auto;font-family:var(--ff-mono);font-size:.62rem;letter-spacing:.12em;color:var(--teal);display:flex;align-items:center;gap:6px}
  .s-brand .live .d{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
  .s-tools{padding:4px 16px 14px;display:flex;gap:10px;align-items:center}
  #acc{background:var(--ink-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:.85rem;outline:none}
  .search{flex:1;position:relative}
  .search input{width:100%;background:var(--ink-2);border:1px solid var(--line);color:var(--text);padding:10px 12px 10px 34px;border-radius:10px;font-size:.9rem;outline:none}
  .search input:focus{border-color:var(--gold)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
  #chats{overflow-y:auto;flex:1;padding:4px 8px 12px}
  #chats::-webkit-scrollbar,#msgs::-webkit-scrollbar{width:9px}
  #chats::-webkit-scrollbar-thumb,#msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}
  .chat{padding:11px 12px;border-radius:12px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:background .15s}
  .chat:hover{background:var(--ink-2)}
  .chat.active{background:var(--ink-3)}
  .av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:16px;font-weight:600;color:#0c1220;background:linear-gradient(140deg,#c9d4ea,#8ea0c4)}
  .av.grp{background:linear-gradient(140deg,var(--gold),var(--gold-deep));color:#1a1204}
  .c-main{min-width:0;flex:1}
  .c-r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .c-nm{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-ts{font-family:var(--ff-mono);color:var(--faint);font-size:.68rem;flex:none}
  .c-pv{color:var(--muted);font-size:.83rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .c-badge{font-family:var(--ff-mono);font-size:.6rem;color:var(--gold);letter-spacing:.05em;margin-top:3px}
  .empty{color:var(--muted);text-align:center;margin-top:56px;padding:0 30px;font-size:.92rem;line-height:1.6}

  /* ————— Main ————— */
  #main{display:flex;flex-direction:column;min-height:0;background:var(--ink-0);
    background-image:radial-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:22px 22px}
  #head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:rgba(14,21,38,.7);backdrop-filter:blur(8px)}
  #head .h-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#0c1220;background:linear-gradient(140deg,#c9d4ea,#8ea0c4);font-size:14px}
  #head .h-nm{font-family:var(--ff-display);font-size:1.15rem}
  #msgs{flex:1;overflow-y:auto;padding:22px 22px 28px;display:flex;flex-direction:column;gap:6px}
  .m{max-width:64%;padding:9px 13px;border-radius:12px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .m.me{align-self:flex-end;background:var(--out);border-radius:12px 12px 4px 12px}
  .m.them{align-self:flex-start;background:var(--ink-2);border-radius:12px 12px 12px 4px}
  .m .who{font-size:.78rem;color:var(--gold);font-weight:600;margin-bottom:3px}
  .m .t{font-size:.64rem;color:var(--faint);font-family:var(--ff-mono);text-align:right;margin-top:4px}
  .m a{color:var(--teal)}
  .media{max-width:260px;max-height:320px;border-radius:10px;display:block;margin:2px 0 5px;cursor:pointer}
  video.media{cursor:default}
  .media-doc{color:var(--teal);text-decoration:none;font-weight:600;display:inline-block;margin:2px 0}
  .media-missing{color:var(--faint);font-style:italic;font-size:.82rem;margin:2px 0}
  .day{align-self:center;background:var(--ink-2);color:var(--muted);font-size:.7rem;font-family:var(--ff-mono);letter-spacing:.04em;padding:5px 12px;border-radius:100px;margin:10px 0}
  .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--muted);padding:30px}
  .welcome img{width:64px;height:64px;border-radius:18px;opacity:.9}
  .welcome h2{font-family:var(--ff-display);font-size:1.5rem;color:var(--text);font-weight:600}
  @media(max-width:820px){#app{grid-template-columns:1fr}#main{display:none}#app.reading #side{display:none}#app.reading #main{display:flex}}
</style>
</head>
<body>
<div class="beam"></div>

<div id="login">
  <img class="logo" src="/logo.png?v=2" alt="">
  <span class="eyebrow">Votre veille WhatsApp</span>
  <h1>Sentinelle</h1>
  <p>Toutes vos conversations, réunies et lisibles. Entrez votre jeton pour ouvrir le tableau de bord.</p>
  <input id="tok" type="password" placeholder="Jeton d'accès" autocomplete="off">
  <button onclick="login()">Ouvrir</button>
  <p id="lerr" class="err"></p>
  <button id="installBtn" onclick="doInstall()" style="display:none;background:transparent;border:1px solid var(--line);color:var(--muted);padding:10px 18px;box-shadow:none;font-weight:500;font-size:.9rem;margin-top:6px">📲 Installer l'application</button>
</div>

<div id="app">
  <aside id="side">
    <div class="s-brand">
      <img src="/logo.png?v=2" alt="">
      <span class="nm">Sentinelle</span>
      <span class="live"><span class="d"></span>VEILLE</span>
    </div>
    <div class="s-tools">
      <select id="acc" onchange="loadChats()"></select>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="Rechercher dans tout…" oninput="onSearch()">
      </div>
    </div>
    <div id="chats"></div>
  </aside>
  <section id="main">
    <div id="head"><span class="h-nm">Sélectionnez une conversation</span></div>
    <div id="msgs"><div class="welcome"><img src="/logo.png?v=2" alt=""><h2>Bonjour 👋</h2><div>Choisissez une conversation à gauche,<br>ou lancez une recherche.</div></div></div>
  </section>
</div>

<script>
let TOK = localStorage.getItem("sentinel_tok") || "";
let ACC = "";
let CUR = null;
const $ = (s) => document.querySelector(s);

async function api(path, params = {}) {
  const u = new URL(path, location.origin);
  u.searchParams.set("token", TOK);
  if (ACC) u.searchParams.set("account", ACC);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const r = await fetch(u);
  if (r.status === 401) throw new Error("401");
  return r.json();
}
function login(){ TOK=$("#tok").value.trim(); if(!TOK) return; localStorage.setItem("sentinel_tok",TOK); start(); }
$("#tok").addEventListener("keydown",(e)=>{ if(e.key==="Enter") login(); });

async function start(){
  try{
    const accs = await api("/api/accounts");
    $("#login").style.display="none";
    $("#app").style.display="grid";
    const sel=$("#acc");
    sel.innerHTML = accs.map((a)=>`<option value="${a.id}">${escapeHtml(a.id)}${a.connected?" 🟢":" 🔴"}</option>`).join("");
    ACC = accs[0]?.id || "";
    if(accs.length<2) sel.style.display="none";
    loadChats();
  }catch(e){
    $("#lerr").textContent = e.message==="401" ? "Jeton invalide." : "Impossible de joindre le serveur.";
    localStorage.removeItem("sentinel_tok");
  }
}

const fmtTs=(ts)=>new Date(ts).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtDay=(ts)=>new Date(ts).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
function initials(n){ return (String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("")||"?").toUpperCase(); }

async function loadChats(){
  ACC=$("#acc").value;
  const chats=await api("/api/chats");
  const el=$("#chats");
  if(!chats.length){ el.innerHTML=`<div class="empty">Aucun message archivé pour l'instant.<br>Sentinelle importe l'historique dès la connexion.</div>`; return; }
  el.innerHTML=chats.map((c)=>`
    <div class="chat" data-jid="${encodeURIComponent(c.jid)}" data-name="${escapeAttr(c.name)}" data-grp="${c.isGroup?1:0}" onclick="openChat(this)">
      <div class="av ${c.isGroup?"grp":""}">${c.isGroup?"#":escapeHtml(initials(c.name))}</div>
      <div class="c-main">
        <div class="c-r1"><span class="c-nm">${escapeHtml(c.name)}</span><span class="c-ts">${c.lastTs?fmtTs(c.lastTs):""}</span></div>
        <div class="c-pv">${escapeHtml((c.lastSender?c.lastSender+": ":"")+(c.lastText||""))}</div>
        <div class="c-badge">${c.count} messages</div>
      </div>
    </div>`).join("");
}

async function openChat(node){
  document.querySelectorAll(".chat").forEach((n)=>n.classList.remove("active"));
  node.classList.add("active");
  const jid=decodeURIComponent(node.dataset.jid);
  CUR=jid;
  const grp=node.dataset.grp==="1";
  $("#head").innerHTML=`<div class="h-av ${grp?"grp":""}" style="${grp?"background:linear-gradient(140deg,var(--gold),var(--gold-deep));color:#1a1204":""}">${grp?"#":escapeHtml(initials(node.dataset.name))}</div><span class="h-nm">${escapeHtml(node.dataset.name)}</span>`;
  $("#app").classList.add("reading");
  const msgs=await api("/api/messages",{jid});
  renderMsgs(msgs,false);
}

function renderMsgs(msgs,isSearch){
  const box=$("#msgs");
  if(!msgs.length){ box.innerHTML=`<div class="welcome"><div>Rien à afficher.</div></div>`; return; }
  let html="",lastDay="";
  for(const m of msgs){
    const day=fmtDay(m.ts);
    if(!isSearch && day!==lastDay){ html+=`<div class="day">${day}</div>`; lastDay=day; }
    const who=isSearch ? `<div class="who">${escapeHtml(m.chatName||"")} · ${escapeHtml(m.fromMe?"moi":m.sender)}</div>`
                       : (m.fromMe?"":`<div class="who">${escapeHtml(m.sender)}</div>`);
    const media=mediaHtml(m.media);
    const marker=/^\[(image|vidéo|sticker|note vocale|document)/i.test(m.text||"");
    const txt=(media&&marker)?"":linkify(escapeHtml(m.text));
    html+=`<div class="m ${m.fromMe?"me":"them"}">${who}${media}${txt}<div class="t">${fmtTs(m.ts)}</div></div>`;
  }
  box.innerHTML=html;
  if(!isSearch) box.scrollTop=box.scrollHeight;
}

let searchTimer;
function onSearch(){
  clearTimeout(searchTimer);
  const q=$("#q").value.trim();
  searchTimer=setTimeout(async ()=>{
    if(q.length<2){ if(CUR) openChatByJid(CUR); return; }
    const hits=await api("/api/search",{q});
    $("#head").innerHTML=`<span class="h-nm">Recherche « ${escapeHtml(q)} » · ${hits.length}</span>`;
    $("#app").classList.add("reading");
    renderMsgs(hits,true);
  },300);
}
function openChatByJid(jid){ const n=document.querySelector(`.chat[data-jid="${encodeURIComponent(jid)}"]`); if(n) openChat(n); }

function mediaSrc(file){ return "/api/media?token="+encodeURIComponent(TOK)+"&account="+encodeURIComponent(ACC)+"&file="+encodeURIComponent(file); }
function mediaHtml(md){
  if(!md) return "";
  if(!md.file){
    const label={image:"📷 Photo",video:"🎬 Vidéo",audio:"🎤 Audio",document:"📄 Document",sticker:"🩹 Sticker"}[md.kind]||"📎 Média";
    return `<div class="media-missing">${label} (non téléchargé)</div>`;
  }
  const src=mediaSrc(md.file);
  if(md.kind==="image"||md.kind==="sticker") return `<img class="media" src="${src}" loading="lazy" onclick="window.open(this.src)">`;
  if(md.kind==="video") return `<video class="media" controls preload="metadata" src="${src}"></video>`;
  if(md.kind==="audio") return `<audio controls preload="none" src="${src}" style="width:230px;display:block;margin:4px 0"></audio>`;
  return `<a class="media-doc" href="${src}" target="_blank" rel="noopener">📄 ${escapeHtml(md.name||"Document")}</a>`;
}
function linkify(s){ return s.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function escapeHtml(s){ return String(s??"").replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/'/g,"&#39;"); }

setInterval(()=>{ if($("#app").style.display==="grid" && !$("#q").value.trim()) loadChats(); },20000);

// ————— App installable (PWA) —————
if("serviceWorker" in navigator){ navigator.serviceWorker.register("/sw.js").catch(()=>{}); }
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); deferredPrompt=e; const b=$("#installBtn"); if(b) b.style.display="inline-block"; });
async function doInstall(){ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $("#installBtn").style.display="none"; }
window.addEventListener("appinstalled",()=>{ const b=$("#installBtn"); if(b) b.style.display="none"; });

if(TOK) start();
</script>
</body>
</html>
