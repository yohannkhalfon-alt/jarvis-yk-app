<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04060C" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Signature du document</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#04060C; --panel:rgba(10,16,28,0.72); --line:rgba(79,216,235,0.18);
    --blue:#1B6FD8; --cyan:#4FD8EB; --txt:#C8D6E5; --dim:#6B7C93; --ok:#33d17a;
  }
  body {
    background:var(--bg); color:var(--txt); font-family:'Rajdhani',sans-serif; min-height:100vh;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(27,111,216,0.13), transparent);
  }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); }
  h1 { font-family:'Orbitron'; font-size:15px; letter-spacing:2px; color:#EAF4FF; }
  h1 span { color:var(--cyan); }
  main { max-width:720px; margin:0 auto; padding:20px 16px 60px; display:flex; flex-direction:column; gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .titre { font-size:19px; font-weight:700; color:#EAF4FF; }
  .meta { font-size:13px; color:var(--dim); margin-top:4px; }
  iframe { width:100%; height:440px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .pdflink { font-size:13px; margin-top:8px; }
  a { color:var(--cyan); }
  h2 { font-family:'Orbitron'; font-size:12px; letter-spacing:2px; color:var(--cyan); text-transform:uppercase; margin-bottom:12px; }
  canvas.pad { width:100%; height:170px; background:#fff; border-radius:10px; border:1px solid var(--line); touch-action:none; cursor:crosshair; display:block; }
  canvas.pad.petit { height:110px; }
  .padrow { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:8px; }
  .hint { font-size:12px; color:var(--dim); }
  button {
    font-family:'Rajdhani'; font-weight:700; font-size:14px; letter-spacing:1px; cursor:pointer;
    border-radius:10px; border:1px solid var(--line); padding:9px 16px; background:rgba(79,216,235,.08); color:var(--cyan);
  }
  button.primary { background:linear-gradient(135deg,var(--blue),#0d4ea0); color:#fff; border:none; padding:13px 24px; font-size:16px; width:100%; margin-top:14px; }
  button.primary:hover { filter:brightness(1.15); }
  button:disabled { opacity:.5; cursor:default; }
  label.consent { display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.5; margin-top:12px; cursor:pointer; }
  .champdate { display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; font-size:14px; }
  .champdate input { background:rgba(4,6,12,.6); border:1px solid var(--line); border-radius:10px; color:var(--txt); font-family:inherit; font-size:15px; padding:8px 12px; outline:none; color-scheme:dark; }
  .champdate input:focus { border-color:var(--cyan); }
  /* module probatoire : clause d'acceptation + code de vérification */
  .clause { background:rgba(27,111,216,.08); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:8px; font-size:14px; line-height:1.6; }
  .clause b { color:#EAF4FF; }
  .mention input[type=text] { width:100%; background:rgba(4,6,12,.6); border:1px solid var(--line); border-radius:10px; color:var(--txt); font-family:inherit; font-size:16px; padding:11px 13px; outline:none; margin-top:6px; }
  .mention input:focus { border-color:var(--cyan); }
  .otp { border-top:1px solid var(--line); margin-top:16px; padding-top:14px; }
  .otp .rangee { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .otp input { flex:1; min-width:150px; background:rgba(4,6,12,.6); border:1px solid var(--line); border-radius:10px; color:var(--txt); font-family:inherit; font-size:22px; letter-spacing:6px; text-align:center; padding:11px; outline:none; }
  .otp input:focus { border-color:var(--cyan); }
  .badge { display:inline-block; font-size:11px; font-weight:700; letter-spacing:1px; padding:3px 10px; border-radius:20px; background:rgba(51,209,122,.12); color:var(--ok); text-transform:uppercase; }
  input[type=checkbox] { width:18px; height:18px; margin-top:2px; accent-color:var(--cyan); flex:none; }
  .msg { margin-top:10px; font-size:14px; }
  .msg.err { color:#ff6b6b; }
  .done { text-align:center; padding:30px 10px; }
  .done .check { font-size:52px; color:var(--ok); }
  .done h3 { font-size:20px; color:#EAF4FF; margin:12px 0 6px; }
  .done p { color:var(--dim); font-size:14px; line-height:1.6; }
  .vide { text-align:center; color:var(--dim); padding:60px 20px; }
</style>
</head>
<body>
<header>
  <h1>JARVIS·<span>SIGN</span></h1>
</header>
<main id="app"><div class="vide">Chargement du document…</div></main>
<script>
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const id = params.get('id'), token = params.get('token');
const urlPdf = '/api/sign?id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token) + '&pdf=1';
let infos = null, padSig = null, padPar = null;

const echap = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function init() {
  if (!id || !token) { $('#app').innerHTML = '<div class="vide">Lien invalide.</div>'; return; }
  try {
    const res = await fetch('/api/sign?id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(token));
    infos = await res.json();
    if (!res.ok) throw new Error(infos.error || 'Erreur');
  } catch (e) {
    $('#app').innerHTML = '<div class="vide">' + echap(e.message) + '</div>';
    return;
  }
  if (infos.moi.status === 'signe') { ecranFini(true); return; }
  ecranSignature();
}

function ecranSignature() {
  const autres = infos.autres.length
    ? '<div class="meta">Autres signataires : ' + infos.autres.map((a) => echap(a.name) + (a.status === 'signe' ? ' ✓' : '')).join(', ') + '</div>'
    : '';
  const parapheCard = infos.paraphe
    ? '<div class="card"><h2>Votre paraphe (initiales)</h2>' +
      '<canvas class="pad petit" id="padPar"></canvas>' +
      '<div class="padrow"><span class="hint">Dessinez vos initiales — elles seront apposées en bas à droite de chaque page du document</span><button id="effacerPar">Effacer</button></div></div>'
    : '';
  const mentionsHtml = (infos.mentions || []).map((m) =>
    '<label class="consent"><input type="checkbox" class="mention" /> Je coche la mention «&nbsp;<b>' + echap(m) + '</b>&nbsp;» — elle sera inscrite près de ma signature.</label>'
  ).join('');

  $('#app').innerHTML =
    '<div class="card">' +
      '<div class="titre">' + echap(infos.title) + '</div>' +
      '<div class="meta">Signataire : <b>' + echap(infos.moi.name) + '</b></div>' + autres +
    '</div>' +
    '<div class="card">' +
      '<h2>Document à signer</h2>' +
      '<iframe id="apercu"></iframe>' +
      '<div class="pdflink">Aperçu illisible ? <a href="' + urlPdf + '" target="_blank">Ouvrir le PDF dans un nouvel onglet</a></div>' +
    '</div>' +
    parapheCard +
    '<div class="card">' +
      '<h2>Votre signature</h2>' +
      '<canvas class="pad" id="padSig"></canvas>' +
      '<div class="padrow"><span class="hint">Dessinez votre signature ci-dessus (doigt ou souris)</span><button id="effacerSig">Effacer</button></div>' +
      mentionsHtml +
      // --- module probatoire (Module 6 puis Module 1) ---
      (infos.preuveMode ? (
        '<div class="clause"><b>Clause d’acceptation expresse</b><br />' + echap(infos.clauseTexte || '') + '</div>' +
        '<label class="consent"><input type="checkbox" id="clauseOk" /> Je coche cette case pour accepter expressément la clause ci-dessus.</label>' +
        '<div class="mention"><label class="hint" style="display:block;margin-top:10px;">Recopiez exactement la mention <b>Bon pour accord</b> :</label>' +
        '<input type="text" id="mentionTapee" placeholder="Bon pour accord" autocomplete="off" autocapitalize="off" /></div>' +
        '<div class="otp"><b style="font-size:14px;color:#EAF4FF;">Vérification de votre identité</b>' +
        '<div class="hint">Un code à 6 chiffres sera envoyé à ' + echap(infos.emailMasque || '') + '. Il est valable 10 minutes (pensez à vérifier vos indésirables).</div>' +
        '<div class="rangee"><button id="envoiOtp">✉ Recevoir mon code</button>' +
        '<input type="text" id="otpCode" inputmode="numeric" maxlength="6" placeholder="000000" disabled /></div>' +
        '<div class="hint" id="otpEtat"></div></div>'
      ) : '') +
      (infos.dateImposee
        ? '<div class="champdate"><span>Date inscrite sur le document : <b>Fait le ' + infos.dateImposee.split('-').reverse().join('/') + '</b> (fixée par l’expéditeur)</span></div>'
        : '<div class="champdate"><span>Date à inscrire sur le document :</span><input type="date" id="dateSig" /></div>') +
      '<div class="hint">« Fait le … » apparaîtra près de votre signature. La date et l’heure réelles de signature restent enregistrées dans le certificat.</div>' +
      '<label class="consent"><input type="checkbox" id="consent" />' +
        'Je, <b>&nbsp;' + echap(infos.moi.name) + '&nbsp;</b>, déclare avoir lu le document « ' + echap(infos.title) + ' » et consens à le signer électroniquement. Ma signature, la date, mon adresse IP et mon navigateur seront enregistrés dans le certificat de signature.' +
      '</label>' +
      '<button class="primary" id="signer">✍ Signer le document</button>' +
      '<div class="msg" id="msg"></div>' +
    '</div>';

  // Aperçu PDF via blob (l'iframe direct est bloqué par certains navigateurs mobiles)
  fetch(urlPdf).then((r) => r.blob()).then((b) => { $('#apercu').src = URL.createObjectURL(b); });

  padSig = creerPad('padSig', 'effacerSig');
  if (infos.paraphe) padPar = creerPad('padPar', 'effacerPar');
  // date du jour (heure de Paris) proposée par défaut, sauf date imposée par l'expéditeur
  if ($('#dateSig')) $('#dateSig').value = new Intl.DateTimeFormat('fr-CA', { timeZone: 'Europe/Paris' }).format(new Date());
  $('#signer').onclick = envoyer;

  if (infos.preuveMode) {
    // journalise l'ouverture (chronologie du dossier de preuve)
    fetch('/api/sign', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'ouverture', id, token, ecran: screen.width + 'x' + screen.height + (matchMedia('(pointer:coarse)').matches ? ' mobile' : ' bureau') }),
    }).catch(() => {});
    $('#envoiOtp').onclick = demanderOtp;
  }
}

async function demanderOtp() {
  const b = $('#envoiOtp'), etat = $('#otpEtat');
  b.disabled = true; etat.style.color = ''; etat.textContent = 'Envoi du code…';
  try {
    const res = await fetch('/api/sign', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'otp', id, token }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur');
    $('#otpCode').disabled = false;
    $('#otpCode').focus();
    etat.style.color = '#33d17a';
    etat.textContent = '✓ Code envoyé à ' + data.emailMasque + ' (envoi ' + data.envois + '/5). Valable 10 minutes.';
    b.textContent = 'Renvoyer le code';
    let reste = 30;
    const tic = setInterval(() => {
      reste--;
      b.textContent = reste > 0 ? 'Renvoyer (' + reste + 's)' : 'Renvoyer le code';
      if (reste <= 0) { clearInterval(tic); b.disabled = false; }
    }, 1000);
  } catch (e) {
    etat.style.color = '#ff6b6b'; etat.textContent = e.message;
    b.disabled = false;
  }
}

// ---- Pavés de dessin (signature et paraphe) ----
function creerPad(idCanvas, idBouton) {
  const c = document.getElementById(idCanvas);
  const rect = c.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  c.width = rect.width * dpr; c.height = rect.height * dpr;
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#12294a';
  let dessine = false, plein = false;
  const pos = (ev) => {
    const r = c.getBoundingClientRect();
    const p = ev.touches ? ev.touches[0] : ev;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const debut = (ev) => { ev.preventDefault(); dessine = true; const p = pos(ev); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const trace = (ev) => { if (!dessine) return; ev.preventDefault(); const p = pos(ev); ctx.lineTo(p.x, p.y); ctx.stroke(); plein = true; };
  const fin = () => { dessine = false; };
  c.addEventListener('mousedown', debut); c.addEventListener('mousemove', trace); window.addEventListener('mouseup', fin);
  c.addEventListener('touchstart', debut, { passive: false }); c.addEventListener('touchmove', trace, { passive: false }); c.addEventListener('touchend', fin);
  document.getElementById(idBouton).onclick = () => { ctx.clearRect(0, 0, c.width, c.height); plein = false; };
  return { canvas: c, aDessine: () => plein };
}

// Recadre le dessin sur son contenu réel avant envoi (fond transparent)
function rogner(c) {
  const t = c.getContext('2d');
  const img = t.getImageData(0, 0, c.width, c.height);
  let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    if (img.data[(y * c.width + x) * 4 + 3] > 10) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  if (maxX <= minX || maxY <= minY) return null;
  const m = 8;
  const out = document.createElement('canvas');
  out.width = maxX - minX + m * 2; out.height = maxY - minY + m * 2;
  out.getContext('2d').drawImage(c, minX - m, minY - m, out.width, out.height, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

async function envoyer() {
  const msg = $('#msg');
  msg.className = 'msg'; msg.textContent = '';
  if (!padSig.aDessine()) { msg.className = 'msg err'; msg.textContent = 'Dessinez votre signature d’abord.'; return; }
  if (padPar && !padPar.aDessine()) { msg.className = 'msg err'; msg.textContent = 'Dessinez aussi votre paraphe (initiales).'; return; }
  const mentions = [...document.querySelectorAll('.mention')];
  if (mentions.some((m) => !m.checked)) { msg.className = 'msg err'; msg.textContent = 'Cochez toutes les mentions requises.'; return; }
  if (!$('#consent').checked) { msg.className = 'msg err'; msg.textContent = 'Cochez la case de consentement.'; return; }
  if (infos.preuveMode) {
    if (!$('#clauseOk').checked) { msg.className = 'msg err'; msg.textContent = 'Cochez la clause d’acceptation expresse.'; return; }
    const saisie = ($('#mentionTapee').value || '').trim().toLowerCase();
    if (saisie !== 'bon pour accord') { msg.className = 'msg err'; msg.textContent = 'Recopiez exactement la mention « Bon pour accord ».'; return; }
    if (!/^\d{6}$/.test(($('#otpCode').value || '').trim())) { msg.className = 'msg err'; msg.textContent = 'Saisissez le code à 6 chiffres reçu par email.'; return; }
  }
  const png = rogner(padSig.canvas);
  if (!png) { msg.className = 'msg err'; msg.textContent = 'Signature vide, réessayez.'; return; }
  const pngPar = padPar ? rogner(padPar.canvas) : null;
  if (padPar && !pngPar) { msg.className = 'msg err'; msg.textContent = 'Paraphe vide, réessayez.'; return; }
  $('#signer').disabled = true; msg.textContent = 'Signature en cours…';
  try {
    const res = await fetch('/api/sign', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        action: 'sign', id, token, signaturePng: png, paraphePng: pngPar, mentionsAccepted: true, consent: true,
        dateSignature: $('#dateSig') ? $('#dateSig').value || null : null,
        ...(infos.preuveMode ? {
          clauseAcceptee: true,
          mentionTapee: $('#mentionTapee').value.trim(),
          otp: $('#otpCode').value.trim(),
          ecran: screen.width + 'x' + screen.height + ' ' + (screen.colorDepth || '') + 'bit',
        } : {}),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur');
    infos = data;
    ecranFini(false);
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = e.message;
    $('#signer').disabled = false;
  }
}

function ecranFini(deja) {
  const complet = infos.status === 'complet';
  $('#app').innerHTML =
    '<div class="card done">' +
      '<div class="check">✓</div>' +
      '<h3>' + (deja ? 'Document déjà signé' : 'Merci, ' + echap(infos.moi.name) + ' !') + '</h3>' +
      '<p>' + (complet
        ? 'Tous les signataires ont signé. Le document final inclut le certificat de signature.'
        : 'Votre signature a bien été enregistrée. Le document sera finalisé quand tous les signataires auront signé.') + '</p>' +
      '<p style="margin-top:16px;"><a href="' + urlPdf + '" target="_blank"><button>⬇ Télécharger le document' + (complet ? ' signé' : ' (état actuel)') + '</button></a></p>' +
    '</div>';
}

init();
</script>
</body>
</html>
