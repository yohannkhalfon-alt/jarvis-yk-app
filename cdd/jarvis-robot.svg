<svg xmlns="http://www.w3.org/2000/svg" width="250" height="250" viewBox="-125 -130 250 250">
  <defs>
    <linearGradient id="casque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E6FD8"/>
      <stop offset="100%" stop-color="#0C2A60"/>
    </linearGradient>
    <linearGradient id="lueur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#53D7F0"/>
      <stop offset="100%" stop-color="#9BEBFF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- antenne -->
  <line x1="0" y1="-120" x2="0" y2="-100" stroke="#4D8BE8" stroke-width="4"/>
  <circle cx="0" cy="-122" r="5" fill="#53D7F0" filter="url(#glow)"/>
  <!-- casque -->
  <path d="M -88 6 C -88 -72 -50 -102 0 -102 C 50 -102 88 -72 88 6 L 82 58 C 76 88 54 100 36 104 L -36 104 C -54 100 -76 88 -82 58 Z"
        fill="url(#casque)" stroke="#4D8BE8" stroke-width="3"/>
  <!-- circuits -->
  <path d="M -70 -58 L -30 -58 M 30 -58 L 70 -58 M -78 -38 L -58 -38 M 58 -38 L 78 -38" stroke="#4D8BE8" stroke-width="2" opacity=".55"/>
  <circle cx="-30" cy="-58" r="2.5" fill="#53D7F0"/>
  <circle cx="30" cy="-58" r="2.5" fill="#53D7F0"/>
  <!-- visière -->
  <rect x="-70" y="-18" width="140" height="54" rx="22" fill="#061830" stroke="#2C5CA8" stroke-width="2"/>
  <rect x="-64" y="-12" width="128" height="42" rx="18" fill="#071F42"/>
  <!-- croix santé (HUD gauche) -->
  <g filter="url(#glow)">
    <rect x="-45" y="-4" width="9" height="26" rx="2.5" fill="url(#lueur)"/>
    <rect x="-53.5" y="4.5" width="26" height="9" rx="2.5" fill="url(#lueur)"/>
  </g>
  <!-- balance juridique (HUD droite) -->
  <g stroke="#53D7F0" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)">
    <line x1="40" y1="-4" x2="40" y2="22"/>
    <line x1="27" y1="2" x2="53" y2="2"/>
    <path d="M 23 10 A 5.5 4.5 0 0 0 33 10 M 47 10 A 5.5 4.5 0 0 0 57 10"/>
    <line x1="27" y1="2" x2="25" y2="9"/><line x1="27" y1="2" x2="31" y2="9"/>
    <line x1="53" y1="2" x2="51" y2="9"/><line x1="53" y1="2" x2="55" y2="9"/>
  </g>
  <!-- ligne de scan -->
  <rect x="-64" y="6" width="128" height="2.5" fill="#9BEBFF" opacity=".5"/>
  <!-- menton -->
  <path d="M -18 66 L 18 66 L 13 88 L -13 88 Z" fill="#102C5E" stroke="#2C5CA8" stroke-width="2"/>
  <!-- oreilles -->
  <circle cx="-88" cy="14" r="14" fill="#123163" stroke="#4D8BE8" stroke-width="2.5"/>
  <circle cx="88" cy="14" r="14" fill="#123163" stroke="#4D8BE8" stroke-width="2.5"/>
  <circle cx="-88" cy="14" r="5.5" fill="#53D7F0" filter="url(#glow)"/>
  <circle cx="88" cy="14" r="5.5" fill="#53D7F0" filter="url(#glow)"/>
</svg>
