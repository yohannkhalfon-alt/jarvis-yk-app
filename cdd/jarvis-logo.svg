      <rect x="-53.5" y="4.5" width="26" height="9" rx="2.5" fill="url(#lueur)"/>
    </g>
    <g stroke="#53D7F0" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)">
      <line x1="40" y1="-4" x2="40" y2="22"/>
      <line x1="27" y1="2" x2="53" y2="2"/>
      <path d="M 23 10 A 5.5 4.5 0 0 0 33 10 M 47 10 A 5.5 4.5 0 0 0 57 10"/>
      <line x1="27" y1="2" x2="25" y2="9"/><line x1="27" y1="2" x2="31" y2="9"/>
      <line x1="53" y1="2" x2="51" y2="9"/><line x1="53" y1="2" x2="55" y2="9"/>
    </g>
    <rect x="-64" y="6" width="128" height="2.5" fill="#9BEBFF" opacity=".5"/>
    <path d="M -18 66 L 18 66 L 13 88 L -13 88 Z" fill="#102C5E" stroke="#2C5CA8" stroke-width="2"/>
    <circle cx="-88" cy="14" r="14" fill="#123163" stroke="#4D8BE8" stroke-width="2.5"/>
    <circle cx="88" cy="14" r="14" fill="#123163" stroke="#4D8BE8" stroke-width="2.5"/>
    <circle cx="-88" cy="14" r="5.5" fill="#53D7F0" filter="url(#glow)"/>
    <circle cx="88" cy="14" r="5.5" fill="#53D7F0" filter="url(#glow)"/>
