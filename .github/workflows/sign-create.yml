name: sign-create
# Crée une demande de signature JARVIS SIGN depuis un runner GitHub
# (l'environnement de maintenance ne peut pas atteindre netlify.app).
#
# SÉCURITÉ (dépôt public) : la requête et le code admin sont passés en
# inputs et lus UNIQUEMENT à l'exécution via github-script — jamais
# interpolés dans le script affiché, jamais imprimés. Seuls les liens
# signataires sortent dans les journaux, qui sont supprimés juste après
# lecture par la maintenance.
on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: "Requête JSON action=create, encodée en base64 (≤ 60 Ko)"
        required: true
      code:
        description: "Code admin JARVIS SIGN"
        required: true

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const inputs = context.payload.inputs || {};
            const corps = Buffer.from(inputs.payload_b64, "base64").toString("utf8");
            const res = await fetch("https://jarvis-yk-app.netlify.app/api/sign", {
              method: "POST",
              headers: { "content-type": "application/json", "x-sign-code": inputs.code },
              body: corps,
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { core.setFailed("Erreur " + res.status + " : " + (data.error || "inconnue")); return; }
            const env = data.envelope;
            core.info("document_id=" + env.id);
            core.info("titre=" + env.title);
            for (const s of env.signers)
              core.info("LIEN|" + s.name + "|https://jarvis-yk-app.netlify.app/sign/signer.html?id=" + env.id + "&token=" + s.token);
