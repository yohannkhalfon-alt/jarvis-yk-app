name: debug-sign
# Diagnostic de JARVIS SIGN depuis un runner GitHub (l'environnement de
# maintenance de JARVIS ne peut pas atteindre netlify.app directement).
#
# SÉCURITÉ : le dépôt est public, donc les journaux de ce workflow sont
# publics. Le code admin est lu depuis le secret GitHub SIGN_ADMIN_CODE
# (Settings → Secrets and variables → Actions), jamais depuis un input :
# les secrets sont automatiquement masqués dans les journaux. Les tokens
# des signataires et les emails sont exclus de la sortie.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: État des demandes et taille des PDF
        env:
          CODE: ${{ secrets.SIGN_ADMIN_CODE }}
          BASE: https://jarvis-yk-app.netlify.app
        run: |
          if [ -z "$CODE" ]; then
            echo "Secret SIGN_ADMIN_CODE absent : le configurer dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          JSON=$(curl -s -H "x-sign-code: $CODE" "$BASE/api/sign?list=1")
          echo "=== Demandes (tokens et emails masqués) ==="
          echo "$JSON" | jq '[.envelopes[] | {id, title, status, createdAt, paraphe, mentions, positions, notif, signers: [.signers[] | {name, status, signedAt, dateAffichee}]}]' || echo "erreur de parsing"
          echo "=== Taille du PDF servi par demande ==="
          for id in $(echo "$JSON" | jq -r '.envelopes[].id'); do
            size=$(curl -s -o /dev/null -w "%{size_download}" -H "x-sign-code: $CODE" "$BASE/api/sign?id=$id&pdf=1")
            echo "$id : $size octets"
          done
